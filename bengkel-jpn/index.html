<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020711">
  <meta name="description" content="Bengkel Asas Gemini dan Dashboard JPN Sabah">
  <title>Bengkel Asas Gemini dan Dashboard JPN</title>

  <style>
    @font-face{
      font-family:"Heroic";
      src:
        url("../assets/fonts/Heroic.woff2") format("woff2"),
        url("../assets/fonts/Heroic.otf") format("opentype");
      font-display:swap;
    }

    :root{
      --bg:#020711;
      --panel:rgba(4,13,24,.82);
      --line:rgba(53,231,255,.18);
      --cyan:#35E7FF;
      --blue:#4285F4;
      --green:#34A853;
      --yellow:#FBBC05;
      --red:#EA4335;
      --text:#EAFBFF;
      --muted:#8BA9B8;
      --bar-h:48px;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      position:relative;
      background:
        radial-gradient(circle at 50% -10%,rgba(53,231,255,.15),transparent 32%),
        radial-gradient(circle at 88% 18%,rgba(66,133,244,.13),transparent 28%),
        linear-gradient(rgba(53,231,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(53,231,255,.035) 1px,transparent 1px),
        var(--bg);
      background-size:auto,auto,32px 32px,32px 32px,auto;
    }

    #matrix{
      position:fixed;
      inset:0;
      z-index:0;
      opacity:.28;
      pointer-events:none;
    }

    .mountain{
      position:fixed;
      left:-4%;
      right:-4%;
      bottom:0;
      height:30vh;
      min-height:210px;
      z-index:1;
      pointer-events:none;
      background:
        linear-gradient(180deg,rgba(53,231,255,.11),rgba(2,7,17,.96)),
        linear-gradient(90deg,#071522,#0A2338);
      clip-path:polygon(
        0 100%,0 82%,6% 80%,12% 73%,18% 78%,
        24% 65%,30% 70%,36% 46%,41% 55%,
        46% 31%,50% 43%,55% 19%,59% 36%,
        64% 25%,69% 49%,75% 59%,82% 70%,
        88% 74%,94% 84%,100% 80%,100% 100%
      );
      filter:drop-shadow(0 -14px 28px rgba(53,231,255,.10));
      opacity:.88;
    }

    .accent{
      position:fixed;
      left:0;
      right:0;
      top:0;
      height:3px;
      z-index:30;
      background:linear-gradient(
        90deg,
        var(--blue) 0 25%,
        var(--red) 25% 50%,
        var(--yellow) 50% 75%,
        var(--green) 75% 100%
      );
    }

    .topbar{
      position:fixed;
      top:3px;
      left:0;
      right:0;
      height:var(--bar-h);
      z-index:25;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:0 14px;
      background:linear-gradient(180deg,rgba(2,7,17,.96),rgba(2,7,17,.84));
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(18px);
      box-shadow:0 8px 24px rgba(0,0,0,.24);
    }

    .brand{
      min-width:0;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .signal{
      width:9px;
      height:9px;
      flex:none;
      border-radius:50%;
      background:var(--cyan);
      box-shadow:0 0 16px var(--cyan);
      animation:pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{opacity:.45;transform:scale(.9)}
      50%{opacity:1;transform:scale(1.1)}
    }

    .brand-text{
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-family:"Heroic","Arial Narrow",Arial,sans-serif;
      font-size:15px;
      letter-spacing:.09em;
      text-transform:uppercase;
      color:var(--text);
    }

    .status{
      flex:none;
      display:flex;
      align-items:center;
      gap:7px;
      padding:5px 9px;
      border:1px solid rgba(53,231,255,.18);
      border-radius:999px;
      color:var(--cyan);
      background:rgba(53,231,255,.055);
      font-size:9px;
      font-weight:700;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .app-shell{
      position:fixed;
      inset:calc(var(--bar-h) + 3px) 0 0 0;
      z-index:10;
      background:rgba(2,7,17,.40);
    }

    #appFrame{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#020711;
      opacity:0;
      transition:opacity .55s ease;
    }

    #appFrame.ready{opacity:1}

    .loader{
      position:fixed;
      inset:calc(var(--bar-h) + 3px) 0 0 0;
      z-index:20;
      display:grid;
      place-items:center;
      overflow:hidden;
      transition:opacity .55s ease,visibility .55s ease;
    }

    .loader.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader-card{
      position:relative;
      z-index:3;
      width:min(92vw,640px);
      padding:28px 24px 24px;
      border:1px solid rgba(53,231,255,.22);
      border-radius:22px;
      background:linear-gradient(145deg,rgba(10,28,45,.86),rgba(3,12,22,.88));
      backdrop-filter:blur(18px);
      box-shadow:
        0 28px 70px rgba(0,0,0,.40),
        0 0 46px rgba(53,231,255,.08);
      text-align:center;
    }

    .eyebrow{
      margin-bottom:10px;
      font-size:10px;
      font-weight:800;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--cyan);
    }

    .loader-card h1{
      margin:0;
      font-family:"Heroic","Arial Narrow",Arial,sans-serif;
      font-size:clamp(34px,8vw,72px);
      line-height:.92;
      letter-spacing:.025em;
      text-transform:uppercase;
      text-shadow:0 0 28px rgba(53,231,255,.16);
    }

    .loader-card p{
      margin:14px auto 0;
      max-width:480px;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }

    .progress{
      height:5px;
      margin-top:22px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.07);
    }

    .progress i{
      display:block;
      width:45%;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,var(--cyan),var(--blue),var(--green));
      box-shadow:0 0 18px rgba(53,231,255,.42);
      animation:scan 1.25s ease-in-out infinite;
    }

    @keyframes scan{
      0%{transform:translateX(-110%)}
      100%{transform:translateX(330%)}
    }

    .bits{
      margin-top:11px;
      color:rgba(53,231,255,.35);
      font-family:Consolas,monospace;
      font-size:9px;
      letter-spacing:.18em;
    }

    .footer-credit{
      position:fixed;
      z-index:24;
      right:12px;
      bottom:10px;
      padding:5px 9px;
      border:1px solid rgba(53,231,255,.13);
      border-radius:999px;
      background:rgba(2,7,17,.58);
      color:#7E9CAB;
      backdrop-filter:blur(10px);
      font-size:8px;
      letter-spacing:.17em;
      text-transform:uppercase;
      pointer-events:none;
    }

    .footer-credit b{
      color:var(--cyan);
      font-family:"Heroic","Arial Narrow",Arial,sans-serif;
      font-size:10px;
    }

    .brand-text{max-width:calc(100vw - 210px)}
    .status{display:none}
    .fallback{
      display:inline-flex;
      position:fixed;
      z-index:40;
      left:auto;
      right:10px;
      top:9px;
      bottom:auto;
      transform:none;
      text-decoration:none;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(53,231,255,.22);
      background:rgba(2,7,17,.88);
      color:var(--cyan);
      font-size:11px;
      font-weight:700;
    }

    @media(max-width:560px){
      :root{--bar-h:44px}
      .brand-text{font-size:12px}
      .status{font-size:8px;padding:4px 7px}
      .loader-card{padding:24px 18px 20px}
      .footer-credit{display:none}
    }
  </style>
</head>

<body>
  <div class="accent"></div>
  <canvas id="matrix"></canvas>
  <div class="mountain"></div>

  <header class="topbar">
    <div class="brand">
      <span class="signal"></span>
      <div class="brand-text">Bengkel Asas Gemini & Dashboard JPN Sabah</div>
    </div>
    <div class="status">Live System</div>
  </header>

  <div class="loader" id="loader">
    <div class="loader-card">
      <div class="eyebrow">Kinabalu // Matrix // Digital</div>
      <h1>Bengkel JPN Sabah</h1>
      <p>Memuatkan bahan, jadual, kemajuan peserta dan serahan dashboard.</p>
      <div class="progress"><i></i></div>
      <div class="bits">01001011 01001001 01001110 01000001 01000010 01000001 01001100 01010101</div>
    </div>
  </div>

  <main class="app-shell">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbyBCDTXWmbgC8xWx6jxThEUtLtFqv3SoJDDIBplHiolKgDxsbZJytZ3lYG7AzMSihXPIg/exec"
      title="Bengkel Asas Gemini dan Dashboard JPN"
      allow="camera; microphone; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager"
      allowfullscreen>
    </iframe>
  </main>

  <div class="footer-credit">CREATED BY <b>TSJ</b></div>

  <a
    class="fallback"
    id="fallback"
    href="https://script.google.com/macros/s/AKfycbyBCDTXWmbgC8xWx6jxThEUtLtFqv3SoJDDIBplHiolKgDxsbZJytZ3lYG7AzMSihXPIg/exec"
    target="_blank"
    rel="noopener">
    Buka sistem secara terus
  </a>

  <script>
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const fallback = document.getElementById('fallback');

    let loaded = false;

    frame.addEventListener('load', () => {
      loaded = true;
      frame.classList.add('ready');
      setTimeout(() => loader.classList.add('hide'), 650);
    });

    setTimeout(() => {
      if (!loaded) loader.querySelector("p").textContent = "Memuatkan mengambil masa. Anda boleh buka sistem secara terus melalui pautan di atas.";
    }, 8000);

    frame.addEventListener("error", () => {
      loader.querySelector("p").textContent = "Sistem belum dapat dibuka. Gunakan pautan buka terus di atas.";
    });

    // Matrix digital background
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    const chars = '01AI<>/{}[]#*+';
    let drops = [];
    let fontSize = 14;

    function resizeMatrix(){
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const cols = Math.ceil(innerWidth / fontSize);
      drops = Array.from({length:cols}, () => Math.random() * -60);
    }

    function drawMatrix(){
      ctx.fillStyle = 'rgba(2,7,17,.08)';
      ctx.fillRect(0,0,innerWidth,innerHeight);
      ctx.font = fontSize + 'px Consolas, monospace';

      for(let i=0;i<drops.length;i++){
        const ch = chars[Math.floor(Math.random()*chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        const r = Math.random();
        ctx.fillStyle = r > .95 ? '#FBBC05' : (r > .82 ? '#4285F4' : '#35E7FF');
        ctx.fillText(ch,x,y);

        if(y > innerHeight && Math.random() > .975) drops[i] = 0;
        drops[i] += .52;
      }
      requestAnimationFrame(drawMatrix);
    }

    resizeMatrix();
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) drawMatrix();
    addEventListener('resize', resizeMatrix);
  </script>
</body>
</html>
