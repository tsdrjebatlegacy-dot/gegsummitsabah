<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020806" />
  <meta name="robots" content="noindex,nofollow" />
  <title>GPGD Google SABAH 2026 | Maklum Balas</title>

  <style>
    :root{
      --bg:#020806;
      --text:#f4fff8;
      --muted:#9eb5a6;
      --green:#34a853;
      --blue:#4285f4;
      --red:#ea4335;
      --yellow:#fbbc04;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      overflow:hidden;
    }

    .google-bar{
      position:fixed;
      top:0; left:0; right:0;
      height:5px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      z-index:1000;
    }

    .google-bar span:nth-child(1){background:var(--blue)}
    .google-bar span:nth-child(2){background:var(--red)}
    .google-bar span:nth-child(3){background:var(--yellow)}
    .google-bar span:nth-child(4){background:var(--green)}

    .shell{
      position:fixed;
      inset:5px 0 0 0;
      background:var(--bg);
    }

    .portal-frame{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff;
    }

    .loading{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:14px;
      background:
        radial-gradient(circle at 20% 20%,rgba(66,133,244,.16),transparent 30%),
        radial-gradient(circle at 80% 15%,rgba(52,168,83,.14),transparent 30%),
        linear-gradient(145deg,#020806,#07160f);
      z-index:10;
      transition:opacity .3s ease, visibility .3s ease;
    }

    .loading.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .spinner{
      width:42px;
      height:42px;
      border-radius:50%;
      border:4px solid rgba(255,255,255,.12);
      border-top-color:var(--green);
      animation:spin .9s linear infinite;
    }

    .loading-title{
      font-size:16px;
      font-weight:800;
      letter-spacing:.03em;
    }

    .loading-sub{
      font-size:12px;
      color:var(--muted);
      text-align:center;
      padding:0 18px;
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    noscript{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
      background:#020806;
      color:#fff;
      z-index:2000;
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="google-bar" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="shell">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div class="loading-title">GPGD Google SABAH 2026</div>
      <div class="loading-sub">Membuka portal maklum balas…</div>
    </div>

    <iframe
      id="portalFrame"
      class="portal-frame"
      title="GPGD Google SABAH 2026 Maklum Balas"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <noscript>
    JavaScript diperlukan untuk membuka portal maklum balas.
  </noscript>

  <script>
    (() => {
      const BACKEND =
        'https://script.google.com/a/macros/jebat.net/s/AKfycbxR9A4V6U5ulpgpEebn6mTXxFZ5J3-5f5WDPMSsT58jdLWLFlPcnOr60WKpVvMN8Gxc/exec';

      // Forward semua query parameter ke Apps Script.
      // Contoh:
      // /feedback/?session=1
      const incoming = new URLSearchParams(window.location.search);
      const target = new URL(BACKEND);

      incoming.forEach((value, key) => {
        target.searchParams.set(key, value);
      });

      const frame = document.getElementById('portalFrame');
      const loading = document.getElementById('loading');

      frame.addEventListener('load', () => {
        loading.classList.add('hidden');
      });

      frame.src = target.toString();

      setTimeout(() => {
        loading.classList.add('hidden');
      }, 8000);
    })();
  </script>
</body>
</html>
