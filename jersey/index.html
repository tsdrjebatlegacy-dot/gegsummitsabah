<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#06172b"
  >

  <meta
    name="description"
    content="Sistem Tempahan Jersey Rasmi GEG Summit Sabah 2026"
  >

  <title>
    GEG Summit Sabah 2026 | Official Jersey
  </title>


  <style>

    :root {

      --blue: #4285f4;
      --red: #ea4335;
      --yellow: #fbbc04;
      --green: #34a853;

      --dark: #03101e;
      --dark2: #092844;

    }


    * {

      box-sizing: border-box;

    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #03101e;

    }


    /******************************************************
     * GOOGLE COLOUR LINE
     ******************************************************/

    .google-line {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 5px;

      z-index: 9999;

      background:
        linear-gradient(
          90deg,

          var(--blue) 0 25%,

          var(--red) 25% 50%,

          var(--yellow) 50% 75%,

          var(--green) 75% 100%
        );

    }


    /******************************************************
     * LOADING SCREEN
     ******************************************************/

    #loading {

      position: fixed;

      inset: 0;

      z-index: 9998;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: white;

      background:

        radial-gradient(
          circle at 15% 15%,
          rgba(66, 133, 244, .28),
          transparent 32%
        ),

        radial-gradient(
          circle at 85% 80%,
          rgba(52, 168, 83, .18),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #03101e,
          #092844
        );

      transition:
        opacity .45s ease,
        visibility .45s ease;

    }


    #loading.hide {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    .loader-card {

      width:
        min(
          440px,
          calc(100% - 40px)
        );

      padding: 35px;

    }


    .spinner {

      width: 68px;
      height: 68px;

      margin:
        0 auto 22px;

      border-radius: 50%;

      position: relative;

      background:
        conic-gradient(
          var(--blue),
          var(--red),
          var(--yellow),
          var(--green),
          var(--blue)
        );

      animation:
        rotate 1.1s linear infinite;

    }


    .spinner::after {

      content: "";

      position: absolute;

      inset: 7px;

      border-radius: 50%;

      background: #07192e;

    }


    @keyframes rotate {

      to {

        transform: rotate(360deg);

      }

    }


    .loading-label {

      font-size: 11px;

      font-weight: 800;

      letter-spacing: .15em;

      color: #8ab4f8;

      margin-bottom: 9px;

    }


    .loading-title {

      font-size:
        clamp(
          25px,
          6vw,
          38px
        );

      font-weight: 900;

      line-height: 1.05;

      margin-bottom: 11px;

    }


    .loading-text {

      font-size: 13px;

      line-height: 1.6;

      color:
        rgba(
          255,
          255,
          255,
          .60
        );

    }


    /******************************************************
     * APPS SCRIPT FRAME
     ******************************************************/

    #appFrame {

      position: fixed;

      top: 5px;
      left: 0;

      width: 100%;

      height:
        calc(
          100dvh - 5px
        );

      margin: 0;
      padding: 0;

      border: 0;

      display: block;

      background: white;

    }


    /******************************************************
     * MOBILE
     ******************************************************/

    @media(max-width:600px) {

      .loader-card {

        padding: 24px;

      }


      .spinner {

        width: 58px;
        height: 58px;

      }


      .loading-label {

        font-size: 9px;

      }


      .loading-text {

        font-size: 12px;

      }

    }

  </style>

</head>


<body>


  <!-- GOOGLE COLOUR LINE -->

  <div class="google-line"></div>



  <!-- LOADING SCREEN -->

  <div id="loading">

    <div class="loader-card">


      <div class="spinner"></div>


      <div class="loading-label">

        GOOGLE EDUCATOR GROUPS SABAH

      </div>


      <div class="loading-title">

        GEG Summit Sabah

        <br>

        Official Jersey

      </div>


      <div class="loading-text">

        Memuatkan sistem tempahan rasmi

        <br>

        GEG Summit Sabah 2026...

      </div>


    </div>

  </div>



  <!--
  ==========================================================
  GOOGLE APPS SCRIPT WEB APP
  ==========================================================
  -->

  <iframe

    id="appFrame"

    src="https://script.google.com/macros/s/AKfycbxeHgM__Fee7YhygcE6qtFuCV8iAu0c0RPkYLI8QB75PKpue-ZWTXgRAe6acjmCXht5Lg/exec"

    title="Tempahan Jersey GEG Summit Sabah 2026"

    loading="eager"

    referrerpolicy="strict-origin-when-cross-origin"

    allow="clipboard-read; clipboard-write"

    onload="appLoaded()"

  ></iframe>



  <script>

    /******************************************************
     * APP LOADED
     ******************************************************/

    function appLoaded() {

      setTimeout(
        function() {

          const loading =
            document.getElementById(
              'loading'
            );


          if (loading) {

            loading.classList.add(
              'hide'
            );

          }

        },
        650
      );

    }



    /******************************************************
     * SAFETY TIMEOUT
     *
     * Loader akan ditutup selepas 12 saat jika browser
     * mengambil masa lama untuk trigger iframe onload.
     ******************************************************/

    setTimeout(
      function() {

        const loading =
          document.getElementById(
            'loading'
          );


        if (loading) {

          loading.classList.add(
            'hide'
          );

        }

      },
      12000
    );

  </script>


</body>

</html>
