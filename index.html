<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Googleyness Voice in Sabah</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      padding: 24px;

      background:
        radial-gradient(circle at 20% 20%, rgba(52,168,83,.25), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(66,133,244,.35), transparent 32%),
        linear-gradient(145deg, #06101e, #0b1d36 60%, #14325d);
    }

    .card {
      width: 100%;
      max-width: 520px;
    }

    .google-line {
      width: 110px;
      height: 5px;
      margin: 0 auto 28px;
      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #4285F4 0 25%,
          #EA4335 25% 50%,
          #FBBC05 50% 75%,
          #34A853 75% 100%
        );
    }

    .small {
      font-size: 12px;
      font-weight: bold;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .7;
    }

    h1 {
      font-size: clamp(38px, 10vw, 64px);
      line-height: 1;
      margin: 14px 0;
    }

    p {
      line-height: 1.7;
      opacity: .75;
      margin-bottom: 30px;
    }

    .enter {
      display: block;
      width: 100%;
      padding: 18px 20px;

      border-radius: 16px;
      text-decoration: none;

      background: #4285F4;
      color: white;

      font-size: 15px;
      font-weight: bold;

      box-shadow:
        0 15px 35px rgba(66,133,244,.35);
    }

    .date {
      margin-top: 20px;
      font-size: 12px;
      opacity: .65;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="google-line"></div>

    <div class="small">
      GEG Sabah Gala Night 2026
    </div>

    <h1>
      Googleyness<br>
      Voice in Sabah
    </h1>

    <p>
      Portal rasmi AJK, aturcara dan operasi
      GEG Sabah Gala Night 2026.
    </p>

    <a
      class="enter"
      href="MASUKKAN_URL_APPS_SCRIPT_EXEC_DI_SINI">
      ENTER GALA COMMAND APP
    </a>

    <div class="date">
      Ahad • 8 November 2026
    </div>

  </main>

</body>
</html>
